name: Edge Functions de Supabase

# Publica las Edge Functions cuando cambian en main.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-funciones.yml'
  workflow_dispatch:

concurrency:
  group: supabase-funciones
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xoxuewxwxkfgeiioileh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Publicar funciones
        # --use-api: arma el paquete en Supabase, sin Docker. verify_jwt sale de config.toml.
        run: supabase functions deploy --use-api --yes
