name: Backup semanal de la base

# Exporta la base de producción una vez por semana, la cifra y la guarda
# como artifact de la corrida (se conserva 90 días).
# El repo es público: el archivo va cifrado con BACKUP_PASSPHRASE, sin esa clave no se puede abrir.
on:
  schedule:
    - cron: '43 6 * * 1'       # lunes 03:43 en Argentina
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_PROJECT_REF: xoxuewxwxkfgeiioileh
    steps:
      - name: Revisar que esté la clave de cifrado
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta el secret BACKUP_PASSPHRASE: sin él no se guarda el backup."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Exportar roles, esquema y datos
        run: |
          mkdir -p backup
          supabase db dump --remote --password "$SUPABASE_DB_PASSWORD" --role-only -f backup/roles.sql
          supabase db dump --remote --password "$SUPABASE_DB_PASSWORD" -f backup/esquema.sql
          supabase db dump --remote --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f backup/datos.sql
          ls -la backup
      - name: Comprimir y cifrar
        id: cifrar
        run: |
          nombre="cabina86-$(date -u +%Y-%m-%d)"
          tar -czf "$nombre.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$nombre.tar.gz.gpg" "$nombre.tar.gz"
          rm -rf backup "$nombre.tar.gz"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cifrar.outputs.nombre }}
          path: ${{ steps.cifrar.outputs.nombre }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
