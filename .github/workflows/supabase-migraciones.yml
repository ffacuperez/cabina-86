name: Migraciones de Supabase

# Aplica las migraciones nuevas a la base de producción cuando llegan a main.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migraciones.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migraciones
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: xoxuewxwxkfgeiioileh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Fija: la v3 cambió el comportamiento de db push
          version: 3.0.0
      - name: Conectar con el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Aplicar migraciones
        # --remote: desde la v3 db push apunta a la base local; --yes confirma el cambio en producción
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
